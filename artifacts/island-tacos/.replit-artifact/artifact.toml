kind = "web"
previewPath = "/"
title = "Island Tacos - Online Ordering"
version = "1.0.0"
id = "artifacts/island-tacos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18184

[services.development]
run = "pnpm --filter @workspace/island-tacos run dev"

[services.production]
publicDir = "artifacts/island-tacos/dist/public"
serve = "static"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/island-tacos", "run", "build" ]

[services.production.build.env]
# Opt-in for the postbuild step (artifacts/island-tacos/scripts/upload-tarball.mjs)
# to upload the freshly built dist/public/ as a tarball to GCS, where the mini
# PC's UPDATE.bat fetches it via /api/download/frontend. Local dev builds and
# CI builds intentionally do NOT set this so they can't overwrite prod.
UPLOAD_FRONTEND_TARBALL = "1"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18184"
BASE_PATH = "/"
VITE_ADMIN_PATH = "admin"
