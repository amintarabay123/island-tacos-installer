<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Disable browser forced-dark-mode. Our app manages its own light/dark
         theming explicitly; letting Chrome auto-invert on Android inverts the
         already-dark staff-login/KDS pages making buttons invisible, and
         corrupts the light POS theme. -->
    <meta name="color-scheme" content="light" />
    <title>Island Tacos - Online Ordering</title>
    <!-- PWA / Home Screen -->
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <meta name="theme-color" content="#F5A623" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Island Tacos" />
    <!-- iOS uses PNG for touch icon — must NOT be SVG -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/icon-512.png" sizes="512x512" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
