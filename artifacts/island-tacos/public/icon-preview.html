<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; flex-direction: column; gap: 32px; }
  .row { display: flex; align-items: flex-end; gap: 32px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #888; font-size: 13px; }
  img { display: block; border-radius: 22%; box-shadow: 0 8px 40px rgba(0,0,0,0.7); }
  h2 { color: #fff; margin: 0; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <h2>Island Tacos — App Icon Preview</h2>
  <div class="row">
    <div class="item">
      <img src="/icon.svg" width="180" height="180"/>
      <span>180px (Home Screen)</span>
    </div>
    <div class="item">
      <img src="/icon.svg" width="120" height="120"/>
      <span>120px</span>
    </div>
    <div class="item">
      <img src="/icon.svg" width="60" height="60"/>
      <span>60px</span>
    </div>
    <div class="item">
      <img src="/icon.svg" width="32" height="32"/>
      <span>32px</span>
    </div>
  </div>
  <div style="color:#555; font-size:12px;">Compare with the real logo below</div>
  <img src="/logo.png" height="80" style="border-radius:0; box-shadow:none; filter:invert(1) opacity(0.4);"/>
</body>
</html>
