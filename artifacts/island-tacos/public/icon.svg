<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rnd">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- Background: rich warm charcoal matching the brand's bold mono style -->
  <rect width="512" height="512" rx="108" fill="#1A0800"/>

  <!-- Warm amber glow behind taco -->
  <ellipse cx="256" cy="310" rx="220" ry="170" fill="#2E1200"/>

  <!-- ═══ TACO SHELL — faithful to the logo dome shape ═══ -->
  <!-- Outer dome (white) -->
  <path d="M 64 390
           C 64 250, 448 250, 448 390
           Z"
        fill="white"/>

  <!-- Inner dome cutout to create the shell opening feel -->
  <path d="M 98 390
           C 98 278, 414 278, 414 390
           Z"
        fill="#1A0800"/>

  <!-- Shell face — the visible front of the taco shell -->
  <path d="M 64 390
           C 64 250, 448 250, 448 390
           L 414 390
           C 414 278, 98 278, 98 390
           Z"
        fill="white"/>

  <!-- ═══ CROWN SPIKES — exactly like the logo taco ═══ -->
  <!-- Spike 1 (left) -->
  <polygon points="114,286  138,192  168,280" fill="white"/>
  <!-- Spike 2 (center-left) -->
  <polygon points="186,272  214,166  244,270" fill="white"/>
  <!-- Spike 3 (center, tallest — matches logo) -->
  <polygon points="232,270  256,148  280,270" fill="white"/>
  <!-- Spike 4 (center-right) -->
  <polygon points="268,270  298,166  326,272" fill="white"/>
  <!-- Spike 5 (right) -->
  <polygon points="344,280  374,192  398,286" fill="white"/>

  <!-- ═══ FILLING peeking out inside the shell (2 bumps like the logo) ═══ -->
  <ellipse cx="200" cy="290" rx="46" ry="24" fill="#FF7A00"/>
  <ellipse cx="312" cy="290" rx="46" ry="24" fill="#FF7A00"/>
  <!-- Center shadow between bumps -->
  <ellipse cx="256" cy="298" rx="32" ry="16" fill="#1A0800"/>

  <!-- ═══ DOT BORDER — signature style from the logo ═══ -->
  <!-- Bottom arc dots -->
  <g fill="white" opacity="0.55">
    <circle cx="105" cy="420" r="7"/>
    <circle cx="138" cy="444" r="7"/>
    <circle cx="176" cy="460" r="7"/>
    <circle cx="216" cy="468" r="7"/>
    <circle cx="256" cy="470" r="7"/>
    <circle cx="296" cy="468" r="7"/>
    <circle cx="336" cy="460" r="7"/>
    <circle cx="374" cy="444" r="7"/>
    <circle cx="407" cy="420" r="7"/>
  </g>

  <!-- ═══ "IT" monogram subtly at bottom ═══ -->
  <text x="256" y="498" text-anchor="middle"
        font-family="Arial Black, sans-serif"
        font-weight="900" font-size="28" letter-spacing="6"
        fill="white" opacity="0.35">ISLAND TACOS</text>
</svg>
