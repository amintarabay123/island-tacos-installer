kind = "api"
  previewPath = "/cedar-api"
  title = "Cedar Cafe API"
  version = "1.0.0"
  id = "3B4_FFSkEVBkAeYMFRJ2e"

  [[services]]
  localPort = 8181
  name = "Cedar Cafe API"
  paths = ["/cedar-api"]

  [services.development]
  run = "pnpm --filter @workspace/cedar-api run dev"

  [services.production]

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/cedar-api", "run", "build"]

  [services.production.build.env]
  NODE_ENV = "production"

  [services.production.run]
  # start-prod.sh swaps Replit's injected DATABASE_URL to use the "cedarcafe" database.
  # Do NOT hardcode DATABASE_URL here — it is runtime-managed by Replit.
  args = ["sh", "artifacts/cedar-api/start-prod.sh"]

  [services.production.run.env]
  PORT = "8181"
  NODE_ENV = "production"

  [services.production.health.startup]
  path = "/cedar-api/healthz"

  [services.env]
  PORT = "8181"
  # DATABASE_URL is intentionally absent here — Replit injects it automatically.
  # The dev run script (pnpm dev) rewrites it to use the cedarcafe DB name.
  CONFIRMATION_CODE_PREFIX = "CC"
  STORE_PROFILE_ID = "2"
  STORE_NAME = "Cedar Cafe"
  STORE_PHONE = "284-344-9808"
  STORE_EMAIL = "orders@cedarcafebvi.com"
  STORE_ADDRESS = "Road Town, Tortola, BVI"
  STORE_TIMEZONE = "America/Tortola"
  LOCAL_DB_USER = "ccuser"
  LOCAL_DB_NAME = "cedarcafe"
  LOCAL_SERVE_STATIC_PATH = "./artifacts/cedar-cafe/dist/public"
  SYNC_TARGET_URL = ""
