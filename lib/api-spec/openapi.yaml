openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Island Tacos Online Ordering API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu categories and items
  - name: orders
    description: Order management
  - name: payments
    description: Payment processing
  - name: admin
    description: Admin/restaurant management
  - name: store-settings
    description: Per-store identity / brand / contact settings (one row per tenant)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /menu/categories:
    get:
      operationId: listMenuCategories
      tags: [menu]
      summary: List all menu categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
    post:
      operationId: createMenuCategory
      tags: [menu]
      summary: Create a menu category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuCategoryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"

  /menu/categories/{id}:
    patch:
      operationId: updateMenuCategory
      tags: [menu]
      summary: Update a menu category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuCategoryBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuCategory
      tags: [menu]
      summary: Delete a menu category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menu/items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items (optionally filtered by category)
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, preparing, ready, completed, cancelled]
        - name: kdsCleared
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/items/mark-made:
    post:
      operationId: markOrderItemsMade
      tags: [orders]
      summary: Mark a subset of an order's items as already made (staff/KDS)
      description: |
        Used by the Kitchen Display when staff finish making the items on an
        ADD-ON card. Sets `alreadyMade = true` on the listed `order_items`
        rows that belong to the given order. Does NOT change the order's
        overall status — the parent order may still be in `preparing`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkOrderItemsMadeBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/track/{confirmationCode}:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track an order by confirmation code
      parameters:
        - name: confirmationCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate a payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentBody"
      responses:
        "200":
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirm a payment after gateway callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentBody"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"
        "400":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats for admin
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range start
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range end (inclusive)
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [admin]
      summary: Get recent orders for admin dashboard
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range start
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range end (inclusive)
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /store-settings:
    get:
      operationId: getStoreSettings
      tags: [store-settings]
      summary: Read the active store profile (public — used by header, footer, emails, receipts)
      responses:
        "200":
          description: Store profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    patch:
      operationId: updateStoreSettings
      tags: [store-settings]
      summary: Partial-update the active store profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreSettingsBody"
      responses:
        "200":
          description: Updated store profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - sortOrder
        - sendToKds
        - createdAt

    CreateMenuCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean
      required:
        - name

    UpdateMenuCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        posImageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
        openPrice:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - categoryId
        - name
        - price
        - available
        - popular
        - spicy
        - vegetarian
        - openPrice
        - createdAt

    CreateMenuItemBody:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        posImageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
        openPrice:
          type: boolean
      required:
        - categoryId
        - name

    UpdateMenuItemBody:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        posImageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
        openPrice:
          type: boolean

    OrderItemModifier:
      type: object
      properties:
        modifierId:
          type: string
        optionId:
          type: string
        name:
          type: string
        price:
          type: number
      required:
        - modifierId
        - optionId
        - name
        - price

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        menuItemPrice:
          type: number
        quantity:
          type: integer
        notes:
          type: ["string", "null"]
        subtotal:
          type: number
        modifierSelections:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/OrderItemModifier"
        alreadyMade:
          type: boolean
          nullable: true
      required:
        - id
        - orderId
        - menuItemId
        - menuItemName
        - menuItemPrice
        - quantity
        - subtotal

    Order:
      type: object
      properties:
        id:
          type: integer
        confirmationCode:
          type: string
        customerName:
          type: string
        customerEmail:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        orderType:
          type: string
          enum: [pickup, delivery]
        deliveryAddress:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, completed, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        paymentMethod:
          type: string
          enum: [card, athmovil, cash, split, complimentary]
        source:
          type: string
          enum: [online, pos, phone]
          nullable: true
        subtotal:
          type: number
        discountAmount:
          type: number
        tax:
          type: number
        deliveryFee:
          type: number
        total:
          type: number
        amountTendered:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        cancellationReason:
          type: ["string", "null"]
        kdsCleared:
          type: ["boolean", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        estimatedReadyAt:
          type: ["string", "null"]
          format: date-time
        scheduledPickupAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - confirmationCode
        - customerName
        - orderType
        - status
        - paymentStatus
        - paymentMethod
        - subtotal
        - discountAmount
        - tax
        - deliveryFee
        - total
        - items
        - createdAt
        - updatedAt

    CreateOrderItemInput:
      type: object
      properties:
        menuItemId:
          type: ["integer", "null"]
          description: "Null is allowed for POS-only items whose menu entry was deleted after the ticket was created. In that case menuItemName and menuItemPrice must be supplied."
        menuItemName:
          type: ["string", "null"]
          description: "Required when menuItemId is null; used as the snapshotted name for the deleted item."
        menuItemPrice:
          type: ["number", "null"]
          description: "Required when menuItemId is null; used as the snapshotted unit price for the deleted item."
        quantity:
          type: integer
        notes:
          type: ["string", "null"]
        modifierSelections:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/OrderItemModifier"
        alreadyMade:
          type: boolean
          nullable: true
        priceOverride:
          type: ["number", "null"]
          description: "Per-unit price to use instead of the menu item's stored price. Only honored when the menu item has openPrice=true; ignored otherwise."
      required:
        - menuItemId
        - quantity

    CreateOrderBody:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        orderType:
          type: string
          enum: [pickup, delivery]
        deliveryAddress:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [card, athmovil, cash, split, complimentary]
        paymentStatus:
          type: string
          enum: [pending, paid]
        source:
          type: string
          enum: [online, pos, phone]
        discountAmount:
          type: number
        amountTendered:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        scheduledPickupAt:
          type: ["string", "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemInput"
      required:
        - customerName
        - orderType
        - paymentMethod
        - items

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, completed, cancelled]
        estimatedReadyAt:
          type: ["string", "null"]
          format: date-time
        cancellationReason:
          type: ["string", "null"]
        kdsCleared:
          type: boolean
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        actualPaymentMethod:
          type: string
          enum: [cash, card, athmovil, split, complimentary]
        amountTendered:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]

    MarkOrderItemsMadeBody:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: integer
          description: IDs of order_items rows on this order to mark as alreadyMade=true.
      required:
        - itemIds

    InitiatePaymentBody:
      type: object
      properties:
        orderId:
          type: integer
        paymentMethod:
          type: string
          enum: [card, athmovil]
      required:
        - orderId
        - paymentMethod

    PaymentSession:
      type: object
      properties:
        sessionId:
          type: string
        redirectUrl:
          type: ["string", "null"]
        paymentMethod:
          type: string
        amount:
          type: number
        status:
          type: string
      required:
        - sessionId
        - paymentMethod
        - amount
        - status

    ConfirmPaymentBody:
      type: object
      properties:
        orderId:
          type: integer
        sessionId:
          type: string
        gatewayResponse:
          type: object
          additionalProperties: true
      required:
        - orderId
        - sessionId

    PaymentResult:
      type: object
      properties:
        success:
          type: boolean
        orderId:
          type: integer
        message:
          type: string
      required:
        - success
        - orderId
        - message

    AdminStats:
      type: object
      properties:
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        pendingOrders:
          type: integer
        completedOrders:
          type: integer
        cancelledOrders:
          type: integer
        completedBySource:
          type: object
          properties:
            online:
              type: integer
            phone:
              type: integer
            pos:
              type: integer
          required:
            - online
            - phone
            - pos
        popularItems:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
            required:
              - name
              - count
      required:
        - todayOrders
        - todayRevenue
        - pendingOrders
        - completedOrders
        - cancelledOrders
        - completedBySource
        - popularItems

    StoreSettings:
      type: object
      description: Per-store identity / brand / contact settings. One row per tenant.
      properties:
        id:
          type: integer
        storeName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        taxRate:
          type: string
          description: Decimal as string (e.g. "0", "0.0700"). Stored as NUMERIC(5,4) to avoid float drift.
        timezone:
          type: string
          description: IANA timezone (e.g. "America/Tortola").
        currency:
          type: string
          description: ISO 4217 currency code (e.g. "USD").
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - storeName
        - phone
        - email
        - address
        - taxRate
        - timezone
        - currency
        - createdAt
        - updatedAt

    UpdateStoreSettingsBody:
      type: object
      description: Partial update. Any omitted field keeps its current value.
      properties:
        storeName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        taxRate:
          type: string
        timezone:
          type: string
        currency:
          type: string

