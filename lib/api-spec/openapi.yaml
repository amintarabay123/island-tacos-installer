openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Island Tacos Online Ordering API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu categories and items
  - name: orders
    description: Order management
  - name: payments
    description: Payment processing
  - name: admin
    description: Admin/restaurant management
  - name: vapi
    description: Vapi AI phone ordering integration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /menu/categories:
    get:
      operationId: listMenuCategories
      tags: [menu]
      summary: List all menu categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
    post:
      operationId: createMenuCategory
      tags: [menu]
      summary: Create a menu category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuCategoryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"

  /menu/categories/{id}:
    patch:
      operationId: updateMenuCategory
      tags: [menu]
      summary: Update a menu category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuCategoryBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuCategory
      tags: [menu]
      summary: Delete a menu category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menu/items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items (optionally filtered by category)
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a menu item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, preparing, ready, completed, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/track/{confirmationCode}:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track an order by confirmation code
      parameters:
        - name: confirmationCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vapi/menu:
    get:
      operationId: getVapiMenu
      tags: [vapi]
      summary: Get full menu for Vapi AI assistant
      description: Returns all available menu items with categories, prices, and modifiers in a format suitable for the Vapi AI phone ordering assistant.
      responses:
        "200":
          description: Full menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiMenu"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vapi/order:
    post:
      operationId: createVapiOrder
      tags: [vapi]
      summary: Create a phone order via Vapi AI
      description: Receives a completed order from the Vapi AI assistant, creates a pending phone order, and returns confirmation details for the AI to read to the caller. Requires VAPI_WEBHOOK_SECRET authentication header.
      security:
        - VapiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiOrderResult"
        "400":
          description: Invalid order payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Store is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Webhook secret not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate a payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentBody"
      responses:
        "200":
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/confirm:
    post:
      operationId: confirmPayment
      tags: [payments]
      summary: Confirm a payment after gateway callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentBody"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"
        "400":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats for admin
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range start
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range end (inclusive)
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [admin]
      summary: Get recent orders for admin dashboard
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range start
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            description: ISO date string (YYYY-MM-DD) for range end (inclusive)
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - sortOrder
        - sendToKds
        - createdAt

    CreateMenuCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean
      required:
        - name

    UpdateMenuCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        sendToKds:
          type: boolean

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - categoryId
        - name
        - price
        - available
        - popular
        - spicy
        - vegetarian
        - createdAt

    CreateMenuItemBody:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
      required:
        - categoryId
        - name
        - price

    UpdateMenuItemBody:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        menuItemPrice:
          type: number
        quantity:
          type: integer
        notes:
          type: ["string", "null"]
        subtotal:
          type: number
      required:
        - id
        - orderId
        - menuItemId
        - menuItemName
        - menuItemPrice
        - quantity
        - subtotal

    Order:
      type: object
      properties:
        id:
          type: integer
        confirmationCode:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        orderType:
          type: string
          enum: [pickup, delivery]
        deliveryAddress:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, completed, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        paymentMethod:
          type: string
          enum: [card, athmovil, cash]
        source:
          type: string
          enum: [online, pos, phone]
          nullable: true
        subtotal:
          type: number
        tax:
          type: number
        deliveryFee:
          type: number
        total:
          type: number
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        estimatedReadyAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - confirmationCode
        - customerName
        - customerEmail
        - customerPhone
        - orderType
        - status
        - paymentStatus
        - paymentMethod
        - subtotal
        - tax
        - deliveryFee
        - total
        - items
        - createdAt
        - updatedAt

    CreateOrderItemInput:
      type: object
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
        notes:
          type: ["string", "null"]
      required:
        - menuItemId
        - quantity

    CreateOrderBody:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        orderType:
          type: string
          enum: [pickup, delivery]
        deliveryAddress:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [card, athmovil, cash]
        source:
          type: string
          enum: [online, pos, phone]
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemInput"
      required:
        - customerName
        - customerEmail
        - customerPhone
        - orderType
        - paymentMethod
        - items

    VapiModifierOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
      required:
        - id
        - name
        - price

    VapiModifier:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        minSelections:
          type: integer
        maxSelections:
          type: ["integer", "null"]
        options:
          type: array
          items:
            $ref: "#/components/schemas/VapiModifierOption"
      required:
        - name
        - required
        - minSelections
        - options

    VapiMenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        available:
          type: boolean
        popular:
          type: boolean
        spicy:
          type: boolean
        vegetarian:
          type: boolean
        modifiers:
          type: array
          items:
            $ref: "#/components/schemas/VapiModifier"
      required:
        - id
        - name
        - category
        - price
        - available
        - popular
        - spicy
        - vegetarian
        - modifiers

    VapiMenu:
      type: object
      properties:
        restaurantName:
          type: string
        location:
          type: string
        currency:
          type: string
        menu:
          type: array
          items:
            $ref: "#/components/schemas/VapiMenuItem"
      required:
        - restaurantName
        - location
        - currency
        - menu

    VapiOrderItemInput:
      type: object
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
          default: 1
        notes:
          type: ["string", "null"]
        modifierSelections:
          type: array
          items:
            type: object
            properties:
              modifierId:
                type: string
              optionId:
                type: string
              name:
                type: string
              price:
                type: number
            required:
              - modifierId
              - optionId
              - name
              - price
      required:
        - menuItemId

    VapiOrderBody:
      type: object
      properties:
        customerName:
          type: string
        customerPhone:
          type: string
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/VapiOrderItemInput"
      required:
        - customerName
        - customerPhone
        - items

    VapiOrderResult:
      type: object
      properties:
        success:
          type: boolean
        confirmationCode:
          type: string
        total:
          type: number
        estimatedMinutes:
          type: integer
        estimatedReadyAt:
          type: string
          format: date-time
        estimatedReadyAtFormatted:
          type: string
        message:
          type: string
          description: Human-readable message for the AI to read to the caller
      required:
        - success
        - confirmationCode
        - total
        - estimatedMinutes
        - estimatedReadyAt
        - estimatedReadyAtFormatted
        - message

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, completed, cancelled]
        estimatedReadyAt:
          type: ["string", "null"]
          format: date-time
        cancellationReason:
          type: ["string", "null"]
      required:
        - status

    InitiatePaymentBody:
      type: object
      properties:
        orderId:
          type: integer
        paymentMethod:
          type: string
          enum: [card, athmovil]
      required:
        - orderId
        - paymentMethod

    PaymentSession:
      type: object
      properties:
        sessionId:
          type: string
        redirectUrl:
          type: ["string", "null"]
        paymentMethod:
          type: string
        amount:
          type: number
        status:
          type: string
      required:
        - sessionId
        - paymentMethod
        - amount
        - status

    ConfirmPaymentBody:
      type: object
      properties:
        orderId:
          type: integer
        sessionId:
          type: string
        gatewayResponse:
          type: object
          additionalProperties: true
      required:
        - orderId
        - sessionId

    PaymentResult:
      type: object
      properties:
        success:
          type: boolean
        orderId:
          type: integer
        message:
          type: string
      required:
        - success
        - orderId
        - message

    AdminStats:
      type: object
      properties:
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        pendingOrders:
          type: integer
        completedOrders:
          type: integer
        popularItems:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
            required:
              - name
              - count
      required:
        - todayOrders
        - todayRevenue
        - pendingOrders
        - completedOrders
        - popularItems

  securitySchemes:
    VapiSecret:
      type: apiKey
      in: header
      name: x-vapi-secret
      description: Shared webhook secret configured in both Replit (VAPI_WEBHOOK_SECRET) and the Vapi assistant tool settings
